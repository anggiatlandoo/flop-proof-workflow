# SPDX-License-Identifier: MIT
# Generate a Flop Labs proof-of-contribution record on every push to the
# default branch and on every published release, using the scripts from
# the Flop Contribution Proof Generator skill.
#
# Setup: create a repository secret named FLOP_DID with your public
# Technocore DID (did:key:z...). See README.md for details.
#
# The record is verified with verify_contribution.py before anything is
# committed, so a failed guardrail fails the run instead of committing a
# bad proof. The commit message carries [skip ci] so the commit itself
# does not trigger another run.

name: Generate Flop Proof

on:
  push:
    branches:
      - main
    paths-ignore:
      - "flop-proofs/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flop-proof
  cancel-in-progress: false

jobs:
  generate-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution record
        id: generate
        env:
          FLOP_DID: ${{ secrets.FLOP_DID }}
        run: |
          if [ -z "$FLOP_DID" ]; then
            echo "::error::FLOP_DID secret is not set. Create it in Settings > Secrets and variables > Actions (see README.md)."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            TITLE="${{ github.event.repository.name }} v${{ github.ref_name }}"
            URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            DESCRIPTION="Release ${{ github.ref_name }} of ${{ github.event.repository.name }}, recorded as an open-source contribution to the Flop Labs ecosystem."
            OUTPUT="flop-proofs/proof-${{ github.ref_name }}"
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            TITLE="${{ github.event.repository.name }} @ ${SHORT_SHA}"
            URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            DESCRIPTION="Automated proof of contribution for commit ${SHORT_SHA} on the main branch of ${{ github.event.repository.name }}."
            OUTPUT="flop-proofs/proof-main-${SHORT_SHA}"
          fi

          mkdir -p flop-proofs
          python3 scripts/generate_contribution_record.py \
            --title "$TITLE" \
            --description "$DESCRIPTION" \
            --url "$URL" \
            --type "open-source" \
            --did "$FLOP_DID" \
            --author "${{ github.actor }}" \
            --output "$OUTPUT"

          echo "record_json=${OUTPUT}.json" >> "$GITHUB_OUTPUT"
          echo "record_md=${OUTPUT}.md" >> "$GITHUB_OUTPUT"

      - name: Verify contribution record
        run: |
          python3 scripts/verify_contribution.py --json "${{ steps.generate.outputs.record_json }}"

      - name: Show proof summary
        run: |
          echo "=== Proof record (JSON) ==="
          cat "${{ steps.generate.outputs.record_json }}"
          echo ""
          echo "=== Proof record (Markdown) ==="
          cat "${{ steps.generate.outputs.record_md }}"
          {
            echo "## Flop proof generated"
            echo ""
            echo "- Record: \`${{ steps.generate.outputs.record_json }}\`"
            echo "- Event: ${{ github.event_name }} (\`${{ github.ref_name }}\`)"
            echo "- Verified: VALID (see the verify step log for the full JSON report)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit proof files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flop-proofs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Flop proof for ${{ github.ref_name }} [skip ci]"
            git push
          fi
